<div>
  <form id="settingForm">
    <div class="scrollable">
      <div class="section-container">
        <div class="section-header">Settings</div>
        <div class="section-body">
          <div id="settings-section">
            <div class="row">
              <div class="col-2">
                <div class="row">
                  <label for="selectDefaultDay">Default Day</label>
                  <select
                    id="selectDefaultDay"
                    class="form-select"
                    name="defaultDay"
                    onchange="toggleInputs('selectDefaultDay', 'txtDefaultDate')"
                  >
                    <option value="">Select Day (Patient Detail)</option>
                    <option value="Tomorrow">Tomorrow</option>
                    <option value="Today">Today</option>
                    <option value="Yesterday">Yesterday</option>
                  </select>
                </div>
              </div>
              <div class="col-2 ml-1">
                <div class="row">
                  <label for="txtDefaultDate"
                    >Default Date (Patient Detail)</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="txtDefaultDate"
                    name="DefaultDate"
                    onchange="toggleInputs('txtDefaultDate', 'selectDefaultDay')"
                  />
                </div>
              </div>
            </div>
            <br />
            <div class="row">
              <div class="col-2">
                <div class="row">
                  <label>Default Complaint Duration</label>
                  <input
                    type="number"
                    class="form-control"
                    id="txtDefaultComplaintDurationSetting"
                    value="1"
                  />
                </div>
              </div>
              <div class="col-2 ml-1">
                <div class="row">
                  <label>Default Complaint Unit</label>
                  <select class="form-select default-complaint-unit">
                    <option value="" selected>Select Unit</option>
                    <option value="day">day</option>
                    <option value="week">week</option>
                    <option value="month">month</option>
                    <option value="year">year</option>
                  </select>
                </div>
              </div>
            </div>

            <br />
            <div class="row">
              <div class="col-2">
                <div class="row">
                  <label>Default FollowUp Duration</label>
                  <input
                    type="number"
                    class="form-control"
                    id="txtDefaultFollowUpDurationSetting"
                    value="1"
                  />
                </div>
              </div>
              <div class="col-2 ml-1">
                <div class="row">
                  <label>Default FollowUp Unit</label>
                  <select class="form-select default-followup-unit">
                    <option value="" selected>Select Unit</option>
                    <option value="day">day</option>
                    <option value="week">week</option>
                    <option value="month">month</option>
                    <option value="year">year</option>
                  </select>
                </div>
              </div>
            </div>
            <br />

            <div class="row">
              <div class="col-4">
                <div class="row">
                  <label>Surgery Detail Values</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="value1,value2"
                    id="txtboxSurgeryDetailValues"
                  />
                </div>
              </div>
              <div class="col-4 ml-1">
                <div class="row">
                  <label>Investigation Detail Values</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="value1,value2"
                    id="txtboxInvestigationDetailValues"
                  />
                </div>
              </div>
            </div>
            <br />

            <div class="row">
              <div class="col-3">
                <div class="row">
                  <label>Default Prescription Printer Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="txtDefaultPrescriptionPrinterName"
                    value="1"
                  />
                </div>
              </div>
              <div class="col-3 ml-1">
                <div class="row">
                  <label>Default Thermal Printer Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="txtDefaultThermalPrinterName"
                    value="1"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="section-container">
        <div class="section-header">Translations</div>
        <div class="section-body">
          <div id="translations-section">
            <div>
              <table id="translationsContainer" class="table table-bordered">
                <thead>
                  <tr>
                    <th>English</th>
                    <th>Urdu</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Complaint Row Template -->
                  <tr class="translations-row">
                    <!-- Complaint Input -->
                    <td>
                      <input
                        type="text"
                        class="form-control english-input"
                        id="english-input"
                        placeholder="Enter English"
                        required
                      />
                    </td>

                    <td>
                      <input
                        type="text"
                        class="form-control tourdu-input"
                        id="tourdu"
                        placeholder="اردو داخل کریں"
                      />
                    </td>

                    <!-- Remove Button -->
                    <td>
                      <button
                        type="button"
                        class="btn btn-danger remove-translations"
                      >
                        Remove
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>

              <!-- Button to add new translations -->
              <div class="d-flex justify-content-end">
                <button id="addTranslationsBtn" class="btn btn-primary mt-1">
                  Add Translation
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="section-container">
        <div class="section-header">Database Maintenance</div>
        <div class="section-body">
          <p class="text-muted mb-2">
            After deleting many pending patients, the database file may stay large.
            Use this to reclaim unused disk space.
          </p>
          <p id="databaseFreeSpaceInfo" class="mb-3"></p>
          <button type="button" id="btnCompactDatabase" class="btn btn-warning">
            Clean Database File
          </button>
        </div>
      </div>
    </div>
    <!-- Save Prescription -->
    <div class="sticky-footer">
      <div class="mt-4 text-end">
        <!-- Added 'text-end' class -->
        <button type="submit" class="btn btn-success">Save Changes</button>
      </div>
    </div>
  </form>
</div>
    <script src="./scripts/views/settings.js"></script>
