<div
  class="modal fade"
  id="addPatientInstructionModal"
  tabindex="-1"
  aria-labelledby="addPatientInstructionModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <label id="hdnId" class="d-none"></label>
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addPatientInstructionModalLabel">
          Add New Patient Instruction
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="addPatientInstructionForm">
          <div class="mb-3">
            <label for="patientinstructionText" class="form-label">Title</label>
            <input
              type="text"
              class="form-control"
              id="patientinstructionTitle"
              placeholder="Enter Patient Instruction Title"
              required
            />
          </div>
          <div class="mb-3">
            <label for="moredetailText" class="form-label">Detail</label>
            <input
              type="text"
              class="form-control"
              id="textPInstDetail"
              placeholder="Enter Detail"
              required
            />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-primary"
          id="savePatientInstruction"
        >
          Save
        </button>
      </div>
    </div>
  </div>
</div>
    <script src="./scripts/views/popup/edit-patient-instruction.js"></script>
