<div
  class="modal fade"
  id="addPlanModal"
  tabindex="-1"
  aria-labelledby="addPlanModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <label id="hdnId" class="d-none"></label>
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addPlanModalLabel">Add New Plan</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="addPlanForm">
          <div class="mb-3">
            <label for="planText" class="form-label">Plan</label>
            <input
              type="text"
              class="form-control"
              id="planText"
              placeholder="Enter Plan"
              required
            />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" id="savePlan">
          Save
        </button>
      </div>
    </div>
  </div>
</div>
    <script src="./scripts/views/popup/edit-plan.js"></script>
