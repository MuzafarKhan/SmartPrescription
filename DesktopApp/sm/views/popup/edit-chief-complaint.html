<div
  class="modal fade"
  id="addComplaintModal"
  tabindex="-1"
  aria-labelledby="addComplaintModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <label id="hdnId" class="d-none"></label>
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addComplaintModalLabel">
          Add New Complaint
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="addComplaintForm">
          <div class="mb-3">
            <label for="complaintText" class="form-label">Complaint</label>
            <input
              type="text"
              class="form-control"
              id="complaintText"
              placeholder="Enter complaint"
              required
            />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" id="saveComplaint">
          Save
        </button>
      </div>
    </div>
  </div>
</div>
    <script src="./scripts/views/popup/edit-chief-complaint.js"></script>
