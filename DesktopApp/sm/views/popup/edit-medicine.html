<div
  class="modal fade"
  id="addMedicineModal"
  tabindex="-1"
  aria-labelledby="addMedicineModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <label id="hdnId" class="d-none"></label>
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addMedicineModalLabel">Add New Medicine</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="addMedicineForm">
          <div class="mb-3">
            <label for="medicineName" class="form-label">Medicine Name</label>
            <input
              type="text"
              class="form-control"
              id="medicineName"
              placeholder="Enter medicine name"
              required
            />
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="medicineType" class="form-label">Medicine Type</label>
              <select
                id="medicineType"
                class="form-select"
                name="medicineType"
                required
              >
                <option value="">Select Type</option>
                <option value="Tab">TAB</option>
                <option value="Cap">CAP</option>
                <option value="Syrup">SYP</option>
                <option value="Inj">INJ</option>
                <option value="Cream">CREAM</option>
                <option value="DROPS">DROPS</option>
                <option value="GEL">GEL</option>
                <option value="OINT">OINT</option>
                <option value="LOTION">LOTION</option>
              </select>
            </div>
            <div class="col-md-4" id="divinjType">
              <label for="injType" class="form-label">INJ Type</label>
              <select id="injType" class="form-select" name="injType" required>
                <option selected value="IV">IV</option>
                <option value="IM">IM</option>
                <option value="PO">PO</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input
              type="text"
              class="form-control"
              id="quantity"
              placeholder="1 Tab - 1 Spoon"
              required
            />
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="timingType" class="form-label">Timing Type</label>
              <select id="timingType" class="form-select">
                <option value="">Select Timing</option>
                <option value="SOS">SOS</option>
                <option value="STAT">STAT</option>
                <option value="OD">OD</option>
                <option value="OW">OW</option>
                <option value="OM">OM</option>
                <option value="3Monthly">3 Monthly</option>
                <option value="OnceYearly">Once Yearly</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Or Specific Timings</label>
              <div class="row">
                <div class="col">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input timing-checkbox"
                      id="morning"
                    />
                    <label class="form-check-label" for="morning"
                      >Morning</label
                    >
                  </div>
                </div>
                <div class="col">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input timing-checkbox"
                      id="afternoon"
                    />
                    <label class="form-check-label" for="afternoon"
                      >Afternoon</label
                    >
                  </div>
                </div>
                <div class="col">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input timing-checkbox"
                      id="night"
                    />
                    <label class="form-check-label" for="night">Night</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="isPrintableOnPrescriptionCheckChecked"
                  checked
                />
                <label
                  class="form-check-label"
                  for="isPrintableOnPrescriptionCheckChecked"
                  >Is Printable On Prescription</label
                >
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="durationnumber" class="form-label"
                >Duration Number</label
              >
              <input
                type="number"
                class="form-control"
                id="durationnumber"
                placeholder="1"
                value="1"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="duration" class="form-label">Duration</label>
              <select id="slctDuration" class="form-select" required>
                <option value="">Select Duration</option>
                <option value="day">day</option>
                <option value="week" selected>week</option>
                <option value="month">month</option>
                <option value="year">year</option>
                <option value="continue">continue</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="moreDetails" class="form-label">More Details</label>
            <input
              type="text"
              class="form-control"
              id="moreDetails"
              placeholder="Enter more detail"
              required
            />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" id="saveMedicine">
          Save
        </button>
      </div>
    </div>
  </div>
</div>
    <script src="./scripts/views/popup/edit-medicine.js"></script>
