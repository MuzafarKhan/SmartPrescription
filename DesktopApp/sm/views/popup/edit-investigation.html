<div
  class="modal fade"
  id="addInvestigationModal"
  tabindex="-1"
  aria-labelledby="addInvestigationModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <label id="hdnId" class="d-none"></label>
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addInvestigationModalLabel">
          Add New Investigation
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="addInvestigationForm">
          <div class="mb-3">
            <label for="investigationText" class="form-label"
              >Investigation</label
            >
            <input
              type="text"
              class="form-control"
              id="investigationText"
              placeholder="Enter Investigation"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="checkbox"
              class="form-check-input"
              id="isPrintableOnPrescriptionCheckChecked"
              checked
            />
            <label
              class="form-check-label"
              for="isPrintableOnPrescriptionCheckChecked"
              >Is Printable On Prescription</label
            >
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" id="saveInvestigation">
          Save
        </button>
      </div>
    </div>
  </div>
</div>
    <script src="./scripts/views/popup/edit-investigation.js"></script>
