<div>
  <form id="prescriptionForm">
    <div class="scrollable">
      <div class="row">
        <div class="section-container">
          <div class="section-header">Patient Details</div>
          <div class="section-body">
            <div class="row">
              <div class="col-7">
                <div class="row">
                  <div class="col-3">
                    <input
                      type="text"
                      class="form-control"
                      placeholder="MR Number"
                      id="txtMrNumber"
                      disabled
                    />
                  </div>
                  <div class="col-4">
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Type Name"
                      id="txtName"
                      name="name"
                    />
                  </div>
                  <div class="col-2">
                    <input
                      type="number"
                      class="form-control"
                      placeholder="Type Age"
                      id="txtAge"
                      name="age"
                    />
                  </div>
                  <div class="col-3">
                    <input
                      type="text"
                      class="form-control date"
                      id="txtDate"
                      name="date"
                    />
                  </div>
                </div>
              </div>
              <div class="col-5">
                <div>
                  <button
                    type="button"
                    class="btn btn-success btn-sm comorbidity-tab"
                    id="DM"
                  >
                    DM
                  </button>
                  <button
                    type="button"
                    class="btn btn-success comorbidity-tab"
                    id="HTN"
                  >
                    HTN
                  </button>
                  <button
                    type="button"
                    class="btn btn-success comorbidity-tab"
                    id="CVA"
                  >
                    CVA
                  </button>
                  <button
                    type="button"
                    class="btn btn-success comorbidity-tab"
                    id="CAD"
                  >
                    CAD
                  </button>
                  <button
                    type="button"
                    class="btn btn-success comorbidity-tab"
                    id="HEPATITIS"
                  >
                    HEPATITIS
                  </button>
                  <button
                    type="button"
                    class="btn btn-success comorbidity-tab"
                    id="TRAUMA"
                  >
                    TRAUMA
                  </button>
                </div>
              </div>
            </div>
            <div class="mt-4 row">
              <div class="col-45Per mt-5px">
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input syrgry-input"
                    type="checkbox"
                    name="surgery"
                    role="switch"
                    id="laminectomyCheckChecked"
                  />
                  <label class="form-check-label" for="laminectomyCheckChecked"
                    >Laminectomy</label
                  >
                </div>
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input syrgry-input"
                    type="checkbox"
                    name="surgery"
                    role="switch"
                    id="tPFCheckChecked"
                  />
                  <label class="form-check-label" for="tPFCheckChecked"
                    >TPF</label
                  >
                </div>
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input syrgry-input"
                    type="checkbox"
                    name="surgery"
                    role="switch"
                    id="craniotomyCheckChecked"
                  />
                  <label class="form-check-label" for="craniotomyCheckChecked"
                    >Craniotomy</label
                  >
                </div>
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input syrgry-input"
                    type="checkbox"
                    name="surgery"
                    role="switch"
                    id="vPshuntCheckChecked"
                  />
                  <label class="form-check-label" for="vPshuntCheckChecked"
                    >VP shunt</label
                  >
                </div>
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input syrgry-input"
                    type="checkbox"
                    name="surgery"
                    role="switch"
                    id="mMCCheckChecked"
                  />
                  <label class="form-check-label" for="mMCCheckChecked"
                    >MMC</label
                  >
                </div>
              </div>
              <div class="col-1">
                <input
                  type="number"
                  class="form-control duration-surgery-select"
                  value="0"
                />
              </div>
              <div class="col-2">
                <!-- Unit Dropdown -->
                <select class="form-select unit-surgery-select">
                  <option value="" selected>Select Unit</option>
                  <option value="day">day</option>
                  <option value="week">week</option>
                  <option value="month">month</option>
                  <option value="year">year</option>
                </select>
              </div>
              <div class="col-3">
                <input
                  type="text"
                  class="form-control surgeryFurtherdetail-input"
                  placeholder="Enter Detail"
                  list="surgeryFurtherdetailSuggestions"
                />
                <!-- Suggestions -->
                <datalist id="surgeryFurtherdetailSuggestions"></datalist>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-container">
        <div class="section-header">Chief Complaint</div>
        <div class="section-body">
          <div id="chief-complaint-section"></div>
        </div>
      </div>

      

      <div class="section-container">
        <div class="section-header">Diagnosis - Investigation - Plan</div>
        <div class="section-body">
          <div id="diagnosis-section"></div>
        </div>
      </div>

      

      <div class="section-container">
        <div class="section-header">EXAM FINDINGS</div>
        <div class="section-body">
          <div>
            <div class="row">
              <div class="col-1">
                <div class="row">
                  <label>BP</label>
                  <input
                    type="text"
                    class="form-control"
                    id="bpTxtbox"
                    name="BP"
                    value="120/80"
                  />
                </div>
              </div>
              <div class="col-1 ms-2">
                <label>GCS</label>
                <div>
                  <input
                    style="display: inline; width: 44%"
                    type="text"
                    id="gcsTxtBox"
                    class="form-control"
                    name="GCS"
                    value="15"
                  />
                  <span>/15</span>
                </div>
              </div>

              <div class="col-2 ms-2">
                <label>Power</label>
                <div>
                  <label>UL</label>
                  <input
                    style="display: inline; width: 20%"
                    type="text"
                    class="form-control"
                    id="powerUL1TxtBox"
                    value="5"
                  />
                  <span>/5</span>

                  <input
                    style="display: inline; width: 20%"
                    type="text"
                    class="form-control"
                    id="powerUL2TxtBox"
                    value="5"
                  />
                  <span>/5</span>
                </div>
                <div class="ms-1">
                  <label>LL</label>
                  <input
                    style="display: inline; width: 20%"
                    type="text"
                    class="form-control"
                    id="powerLL1TxtBox"
                    value="5"
                  />
                  <span>/5</span>

                  <input
                    style="display: inline; width: 20%"
                    type="text"
                    class="form-control"
                    id="powerLL2TxtBox"
                    value="5"
                  />
                  <span>/5</span>
                </div>
              </div>
              <div class="col-12Per">
                <label>Reflexes</label>
                <div>
                  <select id="select-reflexes" class="form-select">
                    <option select>NORMAL</option>
                    <option>EXAGGERATED</option>
                  </select>
                </div>
              </div>
              <div class="col-12Per">
                <label>FABER</label>
                <div>
                  <select id="select-feber" class="form-select">
                    <option selected>Negative</option>
                    <option>Positive</option>
                  </select>
                </div>
              </div>
              <div class="col-12Per">
                <label>Sensations</label>
                <div>
                  <select id="select-sensations" class="form-select">
                    <option select>INTACT</option>
                    <option>LOST</option>
                  </select>
                </div>
              </div>
              <div class="col-12Per">
                <label>SLR</label>
                <div>
                  <select id="select-slr" class="form-select">
                    <option select>NORMAL</option>
                    <option>RESTRICTED</option>
                  </select>
                </div>
              </div>
              <div class="col-12Per">
                <label>Sphincter </label>
                <div>
                  <select id="select-sphincter" class="form-select">
                    <option selected>INTACT</option>
                    <option>LOST</option>
                  </select>
                </div>
              </div>

              <div class="col-8 mt-4">
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    id="SPERLINGSIGNCheckChecked"
                  />
                  <label class="form-check-label" for="SPERLINGSIGNCheckChecked"
                    >SPERLING SIGN</label
                  >
                </div>
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    id="HOFFSIGNCheckChecked"
                  />
                  <label class="form-check-label" for="HOFFSIGNCheckChecked"
                    >HOFF MAN SIGN</label
                  >
                </div>
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    id="PHALLENSIGNCheckChecked"
                  />
                  <label class="form-check-label" for="PHALLENSIGNCheckChecked"
                    >PHALLEN SIGN</label
                  >
                </div>
                <div class="form-check form-switch form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    id="TINNELSIGNCheckChecked"
                  />
                  <label class="form-check-label" for="TINNELSIGNCheckChecked"
                    >TINNEL SIGN</label
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-container">
        <div class="section-header">Medicine</div>
        <div class="section-body">
          <div id="medicine-section"></div>
        </div>
      </div>

      

      <div class="section-container">
        <div class="section-header">Rehabilitation Aids</div>
        <div class="section-body">
          <div id="rehabilitation-aids-section"></div>
        </div>
      </div>

      

      <div class="section-container">
        <div class="section-header">Patient Instructions</div>
        <div class="section-body">
          <div id="patient-instruction-section"></div>
        </div>
      </div>
      
    </div>
    <!-- Save Prescription -->
    <div class="sticky-footer">
      <div class="row">
        <div class="mt-4 text-end">
          <!-- Added 'text-end' class -->
          <input
            type="number"
            id="txtDefaultFollowUpDurationSettingInput"
            class="form-control followupStyle"
            style="width: 10%; display: inline"
            value="2"
          />

          <!-- Unit Dropdown -->
          <select
            class="form-select default-followup-unit-select followupStyle"
            style="width: 10%; display: inline"
          >
            <option value="" selected>Select Unit</option>
            <option value="day">day</option>
            <option selected value="week">week</option>
            <option value="month">month</option>
            <option value="year">year</option>
          </select>
          <button type="submit" class="btn btn-success" id="printPrescription">
            Print Prescription
          </button>

          <button type="submit" class="btn btn-success" id="printOnThermal">
            Print On Thermal
          </button>
          <button
            type="submit"
            class="btn btn-info"
            onclick="window.location.reload();"
            id="resetData"
          >
            Reset
          </button>
        </div>
      </div>
    </div>
  </form>
  <input type="hidden" id="hdnPrescriptionUniqueId" />
</div>
    <script src="./scripts/views/home.js"></script>
