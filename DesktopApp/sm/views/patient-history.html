<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient History</title>
  </head>

  <body>
    <div class="form-container">
      <form>
        <div class="row m-1">
          <table id="patientHistoryTable" class="display" style="width: 100%">
            <thead>
              <tr>
                <th>MR Number</th>
                <th>Name</th>
                <th>Age</th>
                <th>Last Visit</th>
                <th>Visits</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="row m-1 align-items-center">
          <div class="col-md-6">
            <label class="me-2">Show</label>
            <select id="historyPageSize" class="form-select form-select-sm d-inline-block w-auto">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span class="ms-2">entries</span>
          </div>
          <div class="col-md-6 text-end" id="patientHistoryPager"></div>
        </div>
        <div class="row m-1">
          <div class="col-12" id="patientHistoryInfo"></div>
        </div>
      </form>
    </div>

    <script src="./scripts/views/patient-history.js"></script>
  </body>
</html>
