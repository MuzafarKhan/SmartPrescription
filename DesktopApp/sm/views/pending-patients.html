<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pending Patients</title>
  </head>

  <body>
    <div class="form-container">
      <form>
        <div class="row m-1 align-items-center">
          <div class="col-md-6">
            <button type="button" id="btnClearPendingPatientsModal" class="btn btn-primary mt-1">
              Clear All Pending Patients
            </button>
          </div>
          <div class="col-md-6 text-end">
            <label for="pendingSearch" class="me-2">Search:</label>
            <input
              type="search"
              id="pendingSearch"
              class="form-control form-control-sm d-inline-block"
              style="width: auto; min-width: 220px"
              placeholder="MR number, name, age..."
            />
          </div>
        </div>
        <div class="row m-1">
          <table id="pendingPatientTable" class="display" style="width: 100%">
            <thead>
              <tr>
                <th>MR Number</th>
                <th>Name</th>
                <th>Age</th>
                <th>Date</th>
                <th>Is Printed</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="row m-1 align-items-center">
          <div class="col-md-6">
            <label class="me-2">Show</label>
            <select id="pendingPageSize" class="form-select form-select-sm d-inline-block w-auto">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span class="ms-2">entries</span>
          </div>
          <div class="col-md-6 text-end" id="pendingPatientsPager"></div>
        </div>
        <div class="row m-1">
          <div class="col-12" id="pendingPatientsInfo"></div>
        </div>
      </form>
    </div>

    
      <script src="./scripts/views/pending-patients.js"></script>
  </body>
</html>
