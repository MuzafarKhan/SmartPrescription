<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pending Patients</title>
  </head>

  <body>
    <div class="form-container">
      <div class="d-flex justify-content-end">
        <button id="btnClearPendingPatientsModal" class="btn btn-primary mt-1">
          Clear All Pending Patients
        </button>
      </div>
      <form>
        <div class="row m-1">
          <table id="pendingPatientTable" class="display" style="width: 100%">
            <thead>
              <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Date</th>
                <th>Is Printed</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </form>
    </div>

    
      <script src="./scripts/views/pending-patients.js"></script>
  </body>
</html>
