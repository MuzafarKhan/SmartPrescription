<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Medicine</title>

    <style>
      /* Define the font using @font-face */
      @font-face {
        font-family: "NotoNastaliqUrdu-VariableFont_wght";
        src: url("../fonts/Noto_Nastaliq_Urdu/NotoNastaliqUrdu-VariableFont_wght.ttf")
          format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      /* Apply the font */
      .nastaleeq {
        font-family: "NotoNastaliqUrdu-VariableFont_wght", cursive;
        font-size: 1.5rem;
        direction: rtl; /* Right-to-left for Urdu text */
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <div class="d-flex justify-content-end">
        <button id="btnAddMedicineModal" class="btn btn-primary mt-1">
          Add Medicine
        </button>
      </div>
      <form>
        <div class="row m-1">
          <table id="medicineTable" class="display" style="width: 100%">
            <thead>
              <tr>
                <th>ID</th>
                <th>Medicine</th>
                <th>Timing</th>
                <th>Quantity</th>
                <th>Duration</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </form>
    </div>

    
      <script src="./scripts/views/medicine.js"></script>
  </body>
</html>
